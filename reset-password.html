<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Owner Password | Down the Shore</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f6f8fb;
      color: #172334;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 8px 28px rgba(22, 38, 57, .07);
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: .16em;
      font-weight: 800;
      color: #8a919d;
    }

    h1 {
      margin: 8px 0;
      color: #0d2b4d;
      font-family: Georgia, serif;
      font-size: 30px;
    }

    p {
      color: #6f7782;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: 700;
    }

    input {
      width: 100%;
      margin-top: 6px;
      padding: 11px 12px;
      border: 1px solid #cfd5dd;
      border-radius: 8px;
      font: inherit;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 11px 16px;
      border: 0;
      border-radius: 8px;
      background: #0d2b4d;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.45;
    }

    .message.error {
      display: block;
      background: #f4e3e1;
      color: #7a2f2a;
    }

    .message.success {
      display: block;
      background: #e4ede9;
      color: #315d48;
    }
  </style>
</head>

<body>

  <main class="card">
    <div class="eyebrow">OWNER PORTAL</div>

    <h1>Reset password</h1>

    <p>
      Choose a new password for your Down the Shore owner account.
    </p>

    <form id="resetForm">
      <label>
        New password
        <input
          id="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >
      </label>

      <label>
        Confirm new password
        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >
      </label>

      <button id="resetButton" type="submit">
        Change password
      </button>
    </form>

    <div id="message" class="message"></div>
  </main>

  <script src="site-data.js"></script>

  <script>
    (() => {
      const form = document.getElementById("resetForm");
      const passwordInput = document.getElementById("password");
      const confirmInput = document.getElementById("confirmPassword");
      const button = document.getElementById("resetButton");
      const message = document.getElementById("message");

      function showMessage(text, type) {
        message.textContent = text;
        message.className = `message ${type}`;
      }

      function getConfig() {
        const cfg =
          window.SITE_DATA &&
          window.SITE_DATA.supabase;

        if (!cfg || !cfg.url || !cfg.publishableKey) {
          throw new Error("Site login configuration is missing.");
        }

        return cfg;
      }

      function getRecoveryToken() {
        const hash = new URLSearchParams(
          window.location.hash.replace(/^#/, "")
        );

        const query = new URLSearchParams(
          window.location.search
        );

        return (
          hash.get("access_token") ||
          query.get("access_token") ||
          sessionStorage.getItem("dts_recovery_token")
        );
      }

      const initialToken = getRecoveryToken();

      if (initialToken) {
        sessionStorage.setItem(
          "dts_recovery_token",
          initialToken
        );
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const password = passwordInput.value;
        const confirmPassword = confirmInput.value;

        if (password.length < 8) {
          showMessage(
            "Your new password must be at least 8 characters.",
            "error"
          );
          return;
        }

        if (password !== confirmPassword) {
          showMessage(
            "The passwords do not match.",
            "error"
          );
          return;
        }

        const accessToken = getRecoveryToken();

        if (!accessToken) {
          showMessage(
            "This password reset link is missing or has expired. Please request a new reset email.",
            "error"
          );
          return;
        }

        try {
          button.disabled = true;
          button.textContent = "Changing password…";

          const cfg = getConfig();

          const response = await fetch(
            `${cfg.url}/auth/v1/user`,
            {
              method: "PUT",
              headers: {
                "apikey": cfg.publishableKey,
                "Authorization": `Bearer ${accessToken}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                password
              })
            }
          );

          let result = {};

          try {
            result = await response.json();
          } catch (_) {}

          if (!response.ok) {
            throw new Error(
              result.msg ||
              result.message ||
              result.error_description ||
              "Could not change the password."
            );
          }

          sessionStorage.removeItem("dts_recovery_token");
          sessionStorage.removeItem("dts_token");

          showMessage(
            "Password changed. Returning to the Owner Portal…",
            "success"
          );

          setTimeout(() => {
            window.location.replace("owner.html");
          }, 1200);

        } catch (error) {
          showMessage(
            error.message || "Could not change the password.",
            "error"
          );

          button.disabled = false;
          button.textContent = "Change password";
        }
      });
    })();
  </script>

</body>
</html>
