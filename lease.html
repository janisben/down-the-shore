<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Rental Agreement | Down the Shore</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>
    body {
      background:#f7f4ee;
      color:#24231f;
    }

    .lease-shell {
      max-width:900px;
      margin:0 auto;
      padding:36px 20px 80px;
    }

    .lease-card {
      background:#fff;
      border:1px solid #ded9cf;
      padding:28px;
    }

    .lease-meta {
      display:grid;
      grid-template-columns:
        repeat(auto-fit,minmax(180px,1fr));
      gap:12px;
      margin:20px 0;
    }

    .lease-meta div {
      background:#f5f1e8;
      padding:12px;
    }

    .lease-section {
      margin:28px 0;
    }

    .lease-section h2 {
      font-family:Georgia,serif;
      font-weight:400;
    }

    .initial-box {
      display:flex;
      gap:12px;
      align-items:center;
      margin-top:12px;
    }

    .initial-box input {
      max-width:120px;
    }

    .completed-initials {
      display:inline-block;
      margin-top:12px;
      padding:8px 12px;
      background:#f5f1e8;
      border:1px solid #ded9cf;
    }

    .tenant-signature-record {
      margin:28px 0;
      padding:18px;
      background:#f5f1e8;
      border:1px solid #ded9cf;
    }

    .tenant-signature-record h2 {
      margin-top:0;
      font-family:Georgia,serif;
      font-weight:400;
    }

    .signature-box {
      margin-top:28px;
      padding-top:20px;
      border-top:1px solid #ddd;
    }

    .notice {
      padding:14px;
      background:#f5f1e8;
      margin:18px 0;
    }

    button {
      padding:12px 18px;
    }

    input {
      padding:10px;
      border:1px solid #cfc9bd;
      border-radius:4px;
      font:inherit;
    }

    button:disabled,
    input:disabled {
      opacity:.65;
    }
  </style>
</head>

<body>

  <main class="lease-shell">

    <h1>Down the Shore</h1>

    <p>Summer Rental Agreement</p>

    <div
      id="leaseMessage"
      class="notice"
    >
      Loading your rental agreement…
    </div>

    <section
      id="leaseCard"
      class="lease-card"
      hidden
    >

      <div
        class="lease-meta"
        id="leaseMeta"
      ></div>

      <div id="leaseBody"></div>

      <div
        id="tenantSignatureRecord"
        class="tenant-signature-record"
        hidden
      ></div>

      <div class="signature-box">

        <h2 id="signatureHeading">
          Tenant signature
        </h2>

        <p id="signatureIntro">
          By signing below, I confirm that I
          have read and agree to the rental
          agreement above.
        </p>

        <label>
          Type your full legal name

          <input
            id="signatureText"
            type="text"
            autocomplete="name"
          >
        </label>

        <div style="margin-top:16px">
          <button
            id="signLeaseButton"
            type="button"
          >
            Sign rental agreement
          </button>
        </div>

        <div
          id="signatureMessage"
          class="notice"
          hidden
        ></div>

      </div>

    </section>

  </main>

  <script>

    const token =
      new URLSearchParams(
        window.location.search
      ).get("token");


    const leaseMessage =
      document.getElementById(
        "leaseMessage"
      );

    const leaseCard =
      document.getElementById(
        "leaseCard"
      );

    const leaseMeta =
      document.getElementById(
        "leaseMeta"
      );

    const leaseBody =
      document.getElementById(
        "leaseBody"
      );

    const signButton =
      document.getElementById(
        "signLeaseButton"
      );

    const signatureText =
      document.getElementById(
        "signatureText"
      );

    const signatureMessage =
      document.getElementById(
        "signatureMessage"
      );

    const signatureHeading =
      document.getElementById(
        "signatureHeading"
      );

    const signatureIntro =
      document.getElementById(
        "signatureIntro"
      );

    const tenantSignatureRecord =
      document.getElementById(
        "tenantSignatureRecord"
      );


    let leasePayload =
      null;


    function esc(value) {
      return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }


    function money(value) {
      return new Intl.NumberFormat(
        "en-US",
        {
          style:"currency",
          currency:"USD"
        }
      ).format(
        Number(value || 0)
      );
    }


    function dateDisplay(value) {
      if (!value) {
        return "";
      }

      return new Date(
        `${value}T12:00:00`
      ).toLocaleDateString(
        "en-US",
        {
          month:"long",
          day:"numeric",
          year:"numeric"
        }
      );
    }


    function formatTimestamp(value) {
      if (!value) {
        return "";
      }

      return new Intl.DateTimeFormat(
        "en-US",
        {
          month:"long",
          day:"numeric",
          year:"numeric",
          hour:"numeric",
          minute:"2-digit"
        }
      ).format(
        new Date(value)
      );
    }


    function tenantSigner() {
      return (
        leasePayload?.signers ||
        []
      ).find(
        signer =>
          signer.signer_role ===
          "tenant"
      ) || null;
    }


    function tenantInitialForSection(
      sectionKey
    ) {
      const tenant =
        tenantSigner();

      if (!tenant) {
        return "";
      }

      const record =
        (
          leasePayload?.initials ||
          []
        ).find(
          item =>
            item.signer_id ===
              tenant.id &&
            item.section_key ===
              sectionKey
        );

      return record?.initials ||
        "";
    }


    function sectionMarkup(
      section
    ) {
      const isOwner =
        leasePayload
          ?.signer
          ?.signer_role ===
        "owner";


      let initialsMarkup =
        "";


      if (
        section.requires_initials
      ) {

        if (isOwner) {

          const completedInitials =
            tenantInitialForSection(
              section.key
            );


          initialsMarkup = `
            <div class="completed-initials">
              <strong>
                Tenant initials:
              </strong>

              ${
                completedInitials
                  ? esc(
                      completedInitials
                    )
                  : "Not recorded"
              }
            </div>
          `;

        } else {

          initialsMarkup = `
            <div class="initial-box">
              <label>
                Initials

                <input
                  type="text"
                  maxlength="6"
                  autocomplete="off"
                  data-initial-key="${
                    esc(section.key)
                  }"
                >
              </label>
            </div>
          `;

        }

      }


      return `
        <section class="lease-section">

          <h2>
            ${esc(section.title)}
          </h2>

          <div>
            ${section.html}
          </div>

          ${initialsMarkup}

        </section>
      `;
    }


    function showTenantSignature() {

      const tenant =
        tenantSigner();


      if (
        !tenant ||
        !tenant.signed_at
      ) {
        tenantSignatureRecord.hidden =
          true;

        return;
      }


      tenantSignatureRecord.innerHTML = `
        <h2>
          Tenant Signature
        </h2>

        <p>
          <strong>Tenant:</strong>
          ${
            esc(
              tenant.signer_name ||
              ""
            )
          }
        </p>

        <p>
          <strong>Signature:</strong>
          ${
            esc(
              tenant.signature_text ||
              tenant.signer_name ||
              ""
            )
          }
        </p>

        <p>
          <strong>Signed:</strong>
          ${
            esc(
              formatTimestamp(
                tenant.signed_at
              )
            )
          }
        </p>
      `;


      tenantSignatureRecord.hidden =
        false;
    }


    function showAlreadySigned() {

      signButton.disabled =
        true;

      signatureText.value =
        leasePayload
          .signer
          .signature_text ||
        "";

      signatureText.disabled =
        true;

      signatureMessage.hidden =
        false;

      signatureMessage.textContent =
        "You have already signed this rental agreement.";

      signButton.textContent =
        "Signed";
    }


    async function loadLease() {

      if (!token) {

        leaseMessage.textContent =
          "This lease link is missing its secure token.";

        return;
      }


      let response;

      try {

        response =
          await fetch(
            `/api/get-lease?token=${
              encodeURIComponent(
                token
              )
            }`
          );

      } catch (_) {

        leaseMessage.textContent =
          "This rental agreement could not be loaded.";

        return;
      }


      let body = {};


      try {
        body =
          await response.json();
      } catch (_) {}


      if (!response.ok) {

        leaseMessage.textContent =
          body.error ||
          "This rental agreement could not be loaded.";

        return;
      }


      leasePayload =
        body;


      leaseMessage.hidden =
        true;

      leaseCard.hidden =
        false;


      const isOwner =
        body.signer
          .signer_role ===
        "owner";


      if (isOwner) {

        signatureHeading.textContent =
          "Landlord signature";

        signatureIntro.textContent =
          "I have reviewed the Tenant's completed rental agreement and confirm and execute this Agreement as Landlord.";

        signButton.textContent =
          "Sign as Landlord";

      } else {

        signatureHeading.textContent =
          "Tenant signature";

        signatureIntro.textContent =
          "By signing below, I confirm that I have read and agree to the rental agreement above.";

        signButton.textContent =
          "Sign rental agreement";

      }


      leaseMeta.innerHTML = `
        <div>
          <strong>Property</strong>
          <br>
          ${
            esc(
              body.lease_data
                ?.property_name ||
              ""
            )
          }
        </div>

        <div>
          <strong>Signer</strong>
          <br>
          ${
            esc(
              body.signer
                ?.signer_name ||
              ""
            )
          }
        </div>

        <div>
          <strong>Arrival</strong>
          <br>
          ${
            esc(
              dateDisplay(
                body.lease_data
                  ?.arrival_date
              )
            )
          }
        </div>

        <div>
          <strong>Departure</strong>
          <br>
          ${
            esc(
              dateDisplay(
                body.lease_data
                  ?.departure_date
              )
            )
          }
        </div>

        <div>
          <strong>Total</strong>
          <br>
          ${
            money(
              body.lease_data
                ?.amount_due
            )
          }
        </div>

        <div>
          <strong>
            Lease status
          </strong>
          <br>
          ${
            esc(
              String(
                body.status ||
                ""
              ).replaceAll(
                "_",
                " "
              )
            )
          }
        </div>
      `;


      leaseBody.innerHTML =
        (
          body.sections ||
          []
        )
          .map(
            sectionMarkup
          )
          .join("");


      if (isOwner) {
        showTenantSignature();
      }


      if (
        body.signer
          .signed_at
      ) {
        showAlreadySigned();
      }

    }


    signButton.addEventListener(
      "click",
      async () => {

        signatureMessage.hidden =
          true;


        const signature =
          signatureText
            .value
            .trim();


        if (!signature) {

          signatureMessage.hidden =
            false;

          signatureMessage.textContent =
            "Enter your full legal name before signing.";

          return;
        }


        const isOwner =
          leasePayload
            ?.signer
            ?.signer_role ===
          "owner";


        const initials =
          {};


        if (!isOwner) {

          document
            .querySelectorAll(
              "[data-initial-key]"
            )
            .forEach(
              input => {

                initials[
                  input.dataset
                    .initialKey
                ] =
                  input
                    .value
                    .trim();

              }
            );


          const missing =
            Object.entries(
              initials
            ).find(
              ([, value]) =>
                !value
            );


          if (missing) {

            signatureMessage.hidden =
              false;

            signatureMessage.textContent =
              "Please complete all required initials before signing.";

            return;
          }

        }


        signButton.disabled =
          true;

        signButton.textContent =
          "Signing…";


        let response;

        try {

          response =
            await fetch(
              "/api/sign-lease",
              {
                method:"POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    token,
                    signature,
                    initials
                  })
              }
            );

        } catch (_) {

          signButton.disabled =
            false;

          signButton.textContent =
            isOwner
              ? "Sign as Landlord"
              : "Sign rental agreement";

          signatureMessage.hidden =
            false;

          signatureMessage.textContent =
            "The lease could not be signed.";

          return;
        }


        let body = {};


        try {
          body =
            await response.json();
        } catch (_) {}


        if (!response.ok) {

          signButton.disabled =
            false;

          signButton.textContent =
            isOwner
              ? "Sign as Landlord"
              : "Sign rental agreement";

          signatureMessage.hidden =
            false;

          signatureMessage.textContent =
            body.error ||
            "The lease could not be signed.";

          return;
        }


        signatureText.disabled =
          true;

        signatureMessage.hidden =
          false;


        if (isOwner) {

          signatureMessage.textContent =
            "Signed successfully. The rental agreement is fully executed.";

          signButton.textContent =
            "Signed";

          return;
        }


        if (
          body.checkout_url
        ) {

          signatureMessage.textContent =
            "Signed successfully. Opening secure payment…";

          signButton.textContent =
            "Signed";

          window.location.href =
            body.checkout_url;

          return;
        }


        if (
          body.paymentReceived &&
          body.awaitingOwnerSignature
        ) {

          signatureMessage.textContent =
            "Signed successfully. Your payment has been received and the agreement has been sent to the owner for signature.";

          signButton.textContent =
            "Signed";

          return;
        }


        if (
          body.guestSideComplete ===
          false
        ) {

          signatureMessage.textContent =
            "Signed successfully. The remaining required signer must complete the agreement next.";

          signButton.textContent =
            "Signed";

          return;
        }


        signatureMessage.textContent =
          "Signed successfully.";

        signButton.textContent =
          "Signed";

      }
    );


    loadLease();

  </script>

</body>
</html>
