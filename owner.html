<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Owner Portal | Down the Shore</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      background: #f7f4ef;
    }

    .wrap {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    .card {
      background: #fff;
      border: 1px solid #ddd;
      padding: 22px;
      margin-bottom: 16px;
    }

    .login {
      max-width: 440px;
      margin: 60px auto;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .res {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: start;
    }

    .meta {
      color: #716f68;
      font-size: 14px;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      padding: 5px 8px;
      background: #f5f1e8;
      margin: 8px 6px 0 0;
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .actions button,
    .money button {
      padding: 9px 12px;
      height: auto;
      min-height: 0;
      width: auto;
    }

    .money {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #ddd;
    }

    .payment-row {
      align-items: center;
    }

    .payment-row input,
    .payment-row select {
      padding: 9px;
      height: 38px;
      box-sizing: border-box;
    }

    .notice {
      padding: 12px;
      background: #e4ede9;
      margin: 12px 0;
    }

    .error {
      background: #f4e3e1;
      color: #7a2f2a;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 700px) {
      .res {
        grid-template-columns: 1fr;
      }

      .actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <section id="loginView" class="card login">
      <div class="eyebrow">OWNER PORTAL</div>

      <h1>Down the Shore</h1>

      <form id="loginForm">
        <label>
          Email
          <input type="email" name="email" required>
        </label>

        <label>
          Password
          <input type="password" name="password" required>
        </label>

        <button class="button" type="submit">
          Sign in
        </button>
      </form>

      <div id="loginMessage"></div>
    </section>

    <section id="portalView" hidden>

      <div class="row" style="justify-content:space-between; align-items:center;">
        <div>
          <div class="eyebrow">OWNER PORTAL</div>
          <h1>Reservations</h1>
        </div>

        <button id="logoutButton">
          Sign out
        </button>
      </div>

      <div id="portalMessage"></div>

      <div id="reservationList"></div>

    </section>

  </div>

  <script src="site-data.js"></script>
  <script src="owner.js"></script>
</body>
</html>
