<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Owner Portal | Down the Shore</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      background: #f7f4ef;
    }

    .wrap {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    .card {
      background: #fff;
      border: 1px solid #ddd;
      padding: 22px;
      margin-bottom: 16px;
    }

    .login {
      max-width: 440px;
      margin: 60px auto;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .res {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: start;
    }

    .meta {
      color: #716f68;
      font-size: 14px;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      padding: 5px 8px;
      background: #f5f1e8;
      margin: 8px 6px 0 0;
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .actions button,
    .money button,
    .manual-form button,
    #ownerCalendarSection button {
      padding: 9px 12px;
      height: auto;
      min-height: 0;
      width: auto;
    }

    .money {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #ddd;
    }

    .payment-row {
      align-items: center;
    }

    .payment-row input,
    .payment-row select {
      padding: 9px;
      height: 38px;
      box-sizing: border-box;
    }

    .notice {
      padding: 12px;
      background: #e4ede9;
      margin: 12px 0;
    }

    .error {
      background: #f4e3e1;
      color: #7a2f2a;
    }

    .manual-form {
      margin-bottom: 30px;
    }

    .manual-form h2 {
      margin-top: 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-grid label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-weight: 600;
    }

    .form-grid input,
    .form-grid select,
    .form-grid textarea {
      padding: 10px;
      border: 1px solid #ccc;
      font: inherit;
      box-sizing: border-box;
      width: 100%;
    }

    .full {
      grid-column: 1 / -1;
    }

    .brokerage-fields {
      display: none;
      grid-column: 1 / -1;
    }

    .brokerage-fields.show {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    #ownerCalendarSection {
      margin-bottom: 30px;
    }

    #ownerCalendar {
      width: 100%;
    }

    .calendar-property {
      margin-bottom: 24px;
    }

    .calendar-property:last-child {
      margin-bottom: 0;
    }

    .calendar-property h3 {
      margin: 0 0 12px;
    }

    .owner-calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .owner-calendar-weekday {
      text-align: center;
      font-size: 11px;
      color: #716f68;
      padding: 5px 0;
    }

    .owner-calendar-day {
      min-height: 68px;
      border: 1px solid #e0ddd7;
      padding: 6px;
      background: #faf8f4;
      box-sizing: border-box;
      font-size: 12px;
    }

    .owner-calendar-day.blank {
      visibility: hidden;
    }

    .owner-calendar-date {
      font-weight: 600;
      margin-bottom: 5px;
    }

    .owner-calendar-item {
      display: block;
      padding: 3px 5px;
      margin-top: 3px;
      font-size: 10px;
      line-height: 1.25;
      border-radius: 2px;
    }

    .owner-calendar-item.booked {
      background: #dfe9e4;
    }

    .owner-calendar-item.pending_payment {
      background: #f3e3ad;
    }

    .owner-calendar-item.pending {
      background: #eee9df;
    }

    .owner-calendar-item.waitlisted {
      background: #e8e1f0;
    }

    .owner-calendar-item.cancelled,
    .owner-calendar-item.declined {
      background: #eee;
      color: #888;
      text-decoration: line-through;
    }

    .owner-calendar-legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .legend-chip {
      padding: 5px 8px;
      font-size: 12px;
      border-radius: 2px;
    }

    .legend-chip.booked {
      background: #dfe9e4;
    }

    .legend-chip.pending {
      background: #f3e3ad;
    }

    .legend-chip.waitlisted {
      background: #e8e1f0;
    }

    .legend-chip.available {
      background: #faf8f4;
      border: 1px solid #ddd;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 700px) {
      .res,
      .form-grid,
      .brokerage-fields.show {
        grid-template-columns: 1fr;
      }

      .actions {
        justify-content: flex-start;
      }

      .full {
        grid-column: auto;
      }

      .owner-calendar-grid {
        grid-template-columns: repeat(7, minmax(40px, 1fr));
        overflow-x: auto;
      }

      .owner-calendar-day {
        min-height: 60px;
        padding: 4px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <section id="loginView" class="card login">
      <div class="eyebrow">OWNER PORTAL</div>

      <h1>Down the Shore</h1>

      <form id="loginForm">
        <label>
          Email
          <input type="email" name="email" required>
        </label>

        <label>
          Password
          <input type="password" name="password" required>
        </label>

        <button class="button" type="submit">
          Sign in
        </button>
      </form>

      <div id="loginMessage"></div>
    </section>

    <section id="portalView" hidden>

      <div class="row" style="justify-content:space-between; align-items:center;">
        <div>
          <div class="eyebrow">OWNER PORTAL</div>
          <h1>Reservations</h1>
        </div>

        <button id="logoutButton">
          Sign out
        </button>
      </div>

      <div id="portalMessage"></div>

      <section class="card manual-form">
        <h2>Add reservation manually</h2>

        <form id="manualReservationForm">
          <div class="form-grid">

            <label>
              Property
              <select name="property_id" id="manualProperty" required>
                <option value="">Choose property</option>
              </select>
            </label>

            <label>
              Booking source
              <select name="booking_source" id="bookingSource" required>
                <option value="direct_manual">Direct / manual</option>
                <option value="brokerage">Real estate company</option>
              </select>
            </label>

            <label>
              Guest last name
              <input type="text" name="guest_name" required>
            </label>

            <label>
              Guest email
              <input type="email" name="guest_email">
            </label>

            <label>
              Guest phone
              <input type="tel" name="guest_phone">
            </label>

            <label>
              Number of guests
              <input type="number" name="adults" min="1" value="1">
            </label>

            <label>
              Arrival
              <input type="date" name="arrival_date" required>
            </label>

            <label>
              Departure
              <input type="date" name="departure_date" required>
            </label>

            <label>
              Amount due
              <input type="number" name="amount_due" min="0" step="0.01">
            </label>

            <label>
              Payment status
              <select name="payment_status">
                <option value="waiting">Waiting for payment</option>
                <option value="paid">Already paid</option>
              </select>
            </label>

            <div id="brokerageFields" class="brokerage-fields">
              <label>
                Brokerage
                <input type="text" name="brokerage_name">
              </label>

              <label>
                Agent name
                <input type="text" name="agent_name">
              </label>

              <label>
                Agent phone
                <input type="tel" name="agent_phone">
              </label>

              <label>
                Agent email
                <input type="email" name="agent_email">
              </label>
            </div>

            <label class="full">
              Owner notes
              <textarea name="owner_notes" rows="3"></textarea>
            </label>

          </div>

          <div style="margin-top:16px;">
            <button type="submit">
              Save reservation
            </button>
          </div>
        </form>

        <div id="manualReservationMessage"></div>
      </section>

      <section class="card" id="ownerCalendarSection">

        <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:18px;">

          <div>
            <div class="eyebrow">MASTER CALENDAR</div>
            <h2 style="margin:4px 0 0;">
              Property calendar
            </h2>
          </div>

          <div class="row">
            <button type="button" id="calendarPrev">
              ← Previous
            </button>

            <button type="button" id="calendarToday">
              Today
            </button>

            <button type="button" id="calendarNext">
              Next →
            </button>
          </div>

        </div>

        <div id="ownerCalendar"></div>

        <div class="owner-calendar-legend">
          <span class="legend-chip available">Available</span>
          <span class="legend-chip pending">Pending / hold</span>
          <span class="legend-chip booked">Booked</span>
          <span class="legend-chip waitlisted">Waitlist</span>
        </div>

      </section>

      <div id="reservationList"></div>

    </section>

  </div>

  <script src="site-data.js"></script>
  <script src="owner.js"></script>
</body>
</html>
